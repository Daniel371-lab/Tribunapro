name: Sync Partidos

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scripts
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependencias
        run: npm install

      - name: Ejecutar sincronización
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_BASE64 }}' > account.json
          export FIREBASE_SERVICE_ACCOUNT_BASE64=$(base64 -w 0 account.json)
          node sync.js
