name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Restaurar google-services.json
        run: echo "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" | base64 -d > android/app/google-services.json

      - name: Preparar firma de release
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/upload-keystore.jks
          cat > android/key.properties <<EOF
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          storeFile=upload-keystore.jks
          EOF

      - name: Instalar dependencias
        run: flutter pub get

      - name: Generar íconos de la app
        run: dart run flutter_launcher_icons

      - name: Compilar APK
        run: flutter build apk --release

      - name: Compilar AAB
        run: flutter build appbundle --release

      - name: Subir APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: tribuna-pro-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Subir AAB como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: tribuna-pro-aab
          path: build/app/outputs/bundle/release/app-release.aab